version: "3.7"

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "38300:80"
    command:
      - /bin/sh
      - -c
      - |
        rm -rf /usr/share/nginx/html/*
        apk add --no-cache curl tar >/dev/null
        curl -fsSL https://codeload.github.com/wpdew/wpdews-umbrell/tar.gz/refs/heads/main \
          | tar -xz --strip-components=2 -C /usr/share/nginx/html wpdews-umbrell-main/wpdews-devtools/css-generator
        exec nginx -g 'daemon off;'
