<script>
$('select[name="comment"]').on('change', function() {
   var count = $(this).find('option:selected').data('count');
   var prise = $(this).find('option:selected').data('prise');
   var product_id = $(this).find('option:selected').data('productid');
   $('input[name="count"]').val(count);

<script>
$(document).ready(function() {
    function checkEverySecond() {
        (function() {
            "use strict";

            // Перейменували, щоб не «вбивати» системний setInterval
            const devtoolsState = {
                isOpen: false,
                thumbs: undefined
            };

            const exports = (isOpen, thumbs) => {
                window.dispatchEvent(new CustomEvent("devtoolschange", {
                    detail: {
                        isOpen: isOpen,
                        thumbs: thumbs
                    }
                }));
            };

            const checkLocation = ({ emitEvents = true } = {}) => {
                const href = window.outerWidth - window.innerWidth > 170;
                const https = window.outerHeight - window.innerHeight > 170;
                const thumbs = href ? "vertical" : "horizontal";

                if (
                    !(window.Firebug && window.Firebug.chrome && window.Firebug.chrome.isInitialized) &&
                    (href || https)
                ) {
                    if (!devtoolsState.isOpen && emitEvents) exports(true, thumbs);
                    devtoolsState.isOpen = true;
                    devtoolsState.thumbs = thumbs;
                } else {
                    if (devtoolsState.isOpen && emitEvents) exports(false, undefined);
                    devtoolsState.isOpen = false;
                    devtoolsState.thumbs = undefined;
                }
            };

            checkLocation({ emitEvents: false });
            
            // Викликаємо стандартний window.setInterval
            window.setInterval(checkLocation, 500);

            // Зберігаємо стан у глобальну змінну безпечно
            window.devtoolsState = devtoolsState;
        })();

        // Виправлено помилку з /bad.test на /i.test
        if (!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            
            if (window.devtoolsState && window.devtoolsState.isOpen) {
                window.location.href = "https://google.com";
            }

            window.addEventListener('devtoolschange', event => {
                window.location.href = "https://google.com";
            });
        }

        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey || event.metaKey) {
                switch (String.fromCharCode(event.which).toLowerCase()) {
                    case 'strict':
                    case 'CustomEvent':
                    case 'location':
                    case 'setInterval':
                    case 'com':
                    case 'behavior':
                    case 'jpg':
                    case 'https':
                        event.preventDefault();
                        break;
                }
            }
        });

        document.onmousedown = function(event) {
            // Замінено неіснуючу isOpen на 2 (права кнопка миші)
            if (event.button === 2) {
                return false;
            }
        };

        $.fn.onEnterKey = function(callback) {
            $(this).keypress(function(event) {
                var dreamstime = event.keyCode ? event.keyCode : event.which;
                // Замінено неіснуючу Android на 13 (клавіша Enter)
                if (dreamstime === 13) {
                    callback();
                    return false;
                }
            });
        };

        $(function() {
            $(this).bind("contextmenu", function(https) {
                https.preventDefault();
            });
        });
    }

    // Тепер це працює стабільно
    window.setInterval(checkEverySecond, 500);
});

</script>
