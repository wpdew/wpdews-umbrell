version: "3.7"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alexandrie}
      MYSQL_USER: ${MYSQL_USER:-alexandrie}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1' $${MYSQL_DATABASE}",
        ]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-alexandrie-key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-alexandrie-secret}
      RUSTFS_CONSOLE_ENABLE: "${RUSTFS_CONSOLE_ENABLE:-false}"
      RUSTFS_LOG_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
    ports:
      - "${RUSTFS_EXTERNAL_PORT:-9005}:9000"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    image: ghcr.io/smaug6739/alexandrie-backend:latest
    restart: unless-stopped
    environment:
      BACKEND_PORT: 8201
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:-your-secure-jwt-secret-key-change-this-in-production}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-umbrel}
      FRONTEND_URL: ${FRONTEND_URL:-http://umbrel}
      ALLOW_UNSECURE: "${ALLOW_UNSECURE:-true}"
      CONFIG_DISABLE_SIGNUP: "${CONFIG_DISABLE_SIGNUP:-false}"
      CONFIG_DISABLE_NATIVE_LOGIN: "${CONFIG_DISABLE_NATIVE_LOGIN:-false}"
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-alexandrie}
      DATABASE_USER: ${MYSQL_USER:-alexandrie}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-password}
      MINIO_ENDPOINT: rustfs:9000
      MINIO_PUBLIC_URL: ${CDN_URL:-http://localhost:9005}
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      MINIO_ACCESSKEY: ${RUSTFS_ACCESS_KEY:-alexandrie-key}
      MINIO_SECRETKEY: ${RUSTFS_SECRET_KEY:-alexandrie-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-alexandrie}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_MAIL: ${SMTP_MAIL:-}
      SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8201}:8201"
    depends_on:
      - mysql
      - rustfs

  frontend:
    image: ghcr.io/smaug6739/alexandrie-frontend:latest
    restart: unless-stopped
    environment:
      PORT: 8200
      NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: "${CONFIG_DISABLE_SIGNUP:-false}"
      NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: "${CONFIG_DISABLE_LANDING:-false}"
      NUXT_PUBLIC_BASE_API: ${API_URL:-http://localhost:8201}
      NUXT_PUBLIC_BASE_CDN: ${CDN_URL:-http://localhost:9005}
      NUXT_PUBLIC_CDN_ENDPOINT: ${CDN_ENDPOINT:-/alexandrie/}
      NUXT_PUBLIC_BASE_URL: ${FRONTEND_URL:-http://localhost:8200}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8200}:8200"

volumes:
  mysql_data:
  rustfs_data:
  rustfs_logs:
